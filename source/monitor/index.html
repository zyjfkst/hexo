<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>绿屏心电图仪 | 刷新线特效 + 方箭头</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1a, #030507);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Fira Code', monospace;
            padding: 20px;
        }

        .crt-container {
            background: #000000;
            border-radius: 28px;
            padding: 20px 20px 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(80, 255, 80, 0.1);
            border: 1px solid #1a3a1a;
        }

        .screen {
            background: #031003;
            border-radius: 16px;
            padding: 12px;
            box-shadow: inset 0 0 30px rgba(0, 20, 0, 0.8), 0 0 0 2px #2a6e2a;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #010c01;
            border-radius: 12px;
            box-shadow: 0 0 0 1px #2aff6e20, 0 0 0 2px #0f3f0f;
            cursor: crosshair;
        }

        .scanlines {
            pointer-events: none;
            position: relative;
            overflow: hidden;
        }
        .scanlines::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.02) 0px,
                rgba(0, 255, 0, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
            border-radius: 12px;
        }

        .info-panel {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #071007cc;
            backdrop-filter: blur(2px);
            padding: 10px 18px;
            border-radius: 40px;
            border-left: 3px solid #2eff6e;
            font-weight: bold;
        }

        .status {
            color: #b3ffbc;
            text-shadow: 0 0 3px #00cc33;
            font-size: 0.85rem;
            letter-spacing: 1px;
            background: #0c1a0c;
            padding: 4px 12px;
            border-radius: 24px;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .key-hint {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .key {
            background: #1e2a1a;
            color: #adffa7;
            padding: 5px 12px;
            border-radius: 30px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            border: 1px solid #4aff6e;
            box-shadow: 0 0 4px #14ff5e;
        }

        .key kbd {
            background: #000000aa;
            padding: 2px 8px;
            border-radius: 30px;
            color: #caffa2;
            margin-right: 6px;
            font-weight: bold;
            border: 1px solid #88ff88;
            font-size: 0.8rem;
        }

        .feedback {
            font-size: 0.7rem;
            background: #0f1f0f;
            padding: 4px 12px;
            border-radius: 40px;
            color: #94ff94;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indicator {
            width: 10px;
            height: 10px;
            background-color: #2eff5e;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ff40;
            transition: 0.1s;
        }
        .indicator.blink {
            background-color: #ffff80;
            box-shadow: 0 0 12px #ffff00;
            transform: scale(1.2);
        }

        .footer {
            font-size: 0.7rem;
            text-align: center;
            color: #3f8440;
            margin-top: 16px;
            font-family: monospace;
        }

        @keyframes subtlePulse {
            0% { text-shadow: 0 0 1px #0f0; }
            100% { text-shadow: 0 0 6px #2eff6e; }
        }
        .status span {
            animation: subtlePulse 1.5s infinite alternate;
        }
    </style>
</head>
<body>
<div class="crt-container">
    <div class="screen scanlines">
        <canvas id="waveCanvas" width="900" height="400" style="width:100%; height:auto; max-width:1000px; aspect-ratio:900/400"></canvas>
    </div>
    <div class="info-panel">
        <div class="status">
            ⚡ <span>GREEN SCREEN MODE</span> ⚡
            <div class="feedback">
                <div class="indicator" id="keyIndicator"></div>
                <span id="actionCount">触发:0</span>
            </div>
        </div>
        <div class="key-hint">
            <div class="key"><kbd>␣</kbd> 波形+断续滴滴</div>
            <div class="key"><kbd>R</kbd> 终止+2秒长鸣</div>
            <div class="key"><kbd>1</kbd> 带圈对号✓</div>
            <div class="key"><kbd>2</kbd> 方箭头→</div>
        </div>
    </div>
    <div class="footer">
        ✦ 刷新线特效：线后方一段波形隐藏，再后方恢复 ✦ 按下空格：动态心电图 + 断续滴滴声 ✦ 按 R 键：停止所有，恢复直线 ✦ 1键对号 / 2键方箭头 ✦
    </div>
</div>

<script>
    (function(){
        // ----- DOM 元素 -----
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const indicator = document.getElementById('keyIndicator');
        const actionCountSpan = document.getElementById('actionCount');
        
        // 固定尺寸
        const WIDTH = 900;
        const HEIGHT = 400;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        const CENTER_Y = HEIGHT / 2;
        
        // 状态变量
        let ecgParams = null;           
        let isWaveActive = false;       
        let beepEnabled = false;        
        let triggerCount = 0;
        
        // 动态刷新相关
        let animationId = null;
        let lastTimestamp = 0;
        let globalPhase = 0;
        const PHASE_SPEED = 0.022;
        
        // 覆盖层符号显示
        let overlayActive = false;
        let overlayType = null;
        let overlayEndTime = 0;
        
        // ========== 刷新线特效 ==========
        let scanX = 0;                      // 刷新线X坐标
        const SCAN_SPEED = 1.6;             // 移动速度 (像素/帧)
        const ERASE_WIDTH = 60;              // 线后方隐藏宽度（像素）
        
        // ========== 音效模块 ==========
        let audioCtx = null;
        let beepInterval = null;
        let longBeepOsc = null;
        
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                console.log("AudioContext created");
            } catch(e) {
                console.warn("Web Audio API not supported", e);
            }
        }
        
        function playShortBeep() {
            if (!audioCtx) {
                initAudio();
                if (!audioCtx) return;
            }
            const actuallyPlay = () => {
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } catch(e) {}
            };
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(actuallyPlay).catch(e=>console.warn);
            } else {
                actuallyPlay();
            }
        }
        
        function startIntermittentBeep() {
            if (beepInterval !== null) return;
            playShortBeep();
            beepInterval = setInterval(() => {
                if (beepEnabled) {
                    playShortBeep();
                } else {
                    stopIntermittentBeep();
                }
            }, 300);
        }
        
        function stopIntermittentBeep() {
            if (beepInterval !== null) {
                clearInterval(beepInterval);
                beepInterval = null;
            }
        }
        
        function playContinuousBeep2Seconds() {
            if (!audioCtx) {
                initAudio();
                if (!audioCtx) return;
            }
            if (longBeepOsc) {
                try { longBeepOsc.stop(); } catch(e) {}
                longBeepOsc = null;
            }
            const actuallyPlay = () => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.value = 0.25;
                    const now = audioCtx.currentTime;
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
                    osc.start(now);
                    osc.stop(now + 2.0);
                    longBeepOsc = osc;
                    osc.onended = () => { if (longBeepOsc === osc) longBeepOsc = null; };
                } catch(e) {}
            };
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(actuallyPlay).catch(e=>console.warn);
            } else {
                actuallyPlay();
            }
        }
        
        function blinkIndicator() {
            if (!indicator) return;
            indicator.classList.add('blink');
            setTimeout(() => indicator.classList.remove('blink'), 120);
        }
        
        function incrementTriggerCount() {
            triggerCount++;
            if (actionCountSpan) actionCountSpan.innerText = `触发:${triggerCount}`;
            blinkIndicator();
        }
        
        // ========== 绘图函数 ==========
        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = "#1d5520";
            ctx.lineWidth = 0.6;
            ctx.shadowBlur = 0;
            for (let x = 0; x <= WIDTH; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y <= HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(WIDTH, y);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(WIDTH, CENTER_Y);
            ctx.strokeStyle = "#4eff6e80";
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }
        
        function drawStraightLine() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawGrid();
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(WIDTH, CENTER_Y);
            ctx.strokeStyle = "#3eff5e";
            ctx.lineWidth = 2.8;
            ctx.shadowColor = "#1aff4d";
            ctx.shadowBlur = 6;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(WIDTH, CENTER_Y);
            ctx.strokeStyle = "#ccffaa";
            ctx.lineWidth = 1.2;
            ctx.shadowBlur = 3;
            ctx.stroke();
            ctx.fillStyle = "#5aff6e";
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(0, CENTER_Y, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(WIDTH, CENTER_Y, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.font = "10px 'Courier New', monospace";
            ctx.fillStyle = "#49b849";
            ctx.fillText("✦ BASELINE LOCK ✦", WIDTH-110, HEIGHT-8);
        }
        
        // 心电图核心算法
        function getNormalizedECG(angle, params) {
            let t = angle % (Math.PI * 2);
            let value = 0;
            let rAmp = params.rAmp;
            let tAmp = params.tAmp;
            let pAmp = params.pAmp;
            let qsAmp = params.qsAmp;
            
            if (t < 0.12) {
                let phaseP = (t / 0.12) * Math.PI;
                value = pAmp * Math.sin(phaseP);
            } 
            else if (t < 0.18) value = 0;
            else if (t < 0.32) {
                let qrsT = (t - 0.18) / 0.14;
                if (qrsT < 0.25) {
                    let qFactor = 1 - (qrsT / 0.25);
                    value = -qsAmp * 0.6 * qFactor;
                } else if (qrsT < 0.55) {
                    let rFactor = Math.sin(((qrsT - 0.25) / 0.3) * Math.PI);
                    value = rAmp * rFactor;
                } else {
                    let sFactor = 1 - ((qrsT - 0.55) / 0.45);
                    value = -qsAmp * sFactor;
                }
            }
            else if (t < 0.5) {
                let stT = (t - 0.32) / 0.18;
                let tRise = Math.sin(stT * Math.PI * 0.8);
                value = tAmp * tRise * 0.7;
            }
            else if (t < 0.75) {
                let tPhase = (t - 0.5) / 0.25;
                let tShape = Math.sin(tPhase * Math.PI);
                value = tAmp * tShape;
            }
            else {
                let restPhase = (t - 0.75) / 0.25;
                value = tAmp * (1 - restPhase) * 0.2;
                if (value < 0) value = 0;
            }
            
            let drift = params.baselineDrift * Math.sin(angle * 0.5);
            value += drift;
            return Math.min(0.95, Math.max(-0.65, value));
        }
        
        function getECGOffsetY(x, params, phaseShift) {
            let heartFreq = params.freq;
            let angle = (x * heartFreq) + phaseShift;
            let normValue = getNormalizedECG(angle, params);
            let maxOffset = params.ampScale;
            return normValue * maxOffset;
        }
        
        // 获取波形点数组
        function getCurrentWaveformPoints(params, phaseShift) {
            let points = [];
            for (let x = 0; x <= WIDTH; x++) {
                let offset = getECGOffsetY(x, params, phaseShift);
                let y = CENTER_Y + offset;
                let clampedY = Math.min(HEIGHT - 5, Math.max(5, y));
                points.push({x, y: clampedY});
            }
            return points;
        }
        
        // 绘制带刷新线特效的心电图（线后方一段隐藏）
        function drawECGWaveformWithRefreshLine(params, phaseShift) {
            if (!params) {
                drawStraightLine();
                return;
            }
            let points = getCurrentWaveformPoints(params, phaseShift);
            
            // 绘制网格
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawGrid();
            
            // 定义擦除区间：[scanX - ERASE_WIDTH, scanX] 内的波形不显示
            const eraseStart = scanX - ERASE_WIDTH;
            const eraseEnd = scanX;
            
            // 分段绘制波形：将连续的可显示区域（不在擦除区间内）分成若干路径
            let segments = [];
            let currentSegment = null;
            for (let i = 0; i < points.length; i++) {
                const x = points[i].x;
                const isVisible = (x < eraseStart || x > eraseEnd);
                if (isVisible) {
                    if (currentSegment === null) {
                        currentSegment = { startIdx: i, points: [] };
                    }
                    currentSegment.points.push(points[i]);
                } else {
                    if (currentSegment !== null) {
                        segments.push(currentSegment);
                        currentSegment = null;
                    }
                }
            }
            if (currentSegment !== null) {
                segments.push(currentSegment);
            }
            
            // 绘制所有可见线段
            ctx.save();
            ctx.beginPath();
            for (let seg of segments) {
                let segPoints = seg.points;
                if (segPoints.length === 0) continue;
                ctx.moveTo(segPoints[0].x, segPoints[0].y);
                for (let i = 1; i < segPoints.length; i++) {
                    ctx.lineTo(segPoints[i].x, segPoints[i].y);
                }
            }
            ctx.strokeStyle = "#3eff6e";
            ctx.lineWidth = 2.4;
            ctx.shadowColor = "#1eff5a";
            ctx.shadowBlur = 5;
            ctx.stroke();
            
            // 高光细线
            ctx.beginPath();
            for (let seg of segments) {
                let segPoints = seg.points;
                if (segPoints.length === 0) continue;
                ctx.moveTo(segPoints[0].x, segPoints[0].y);
                for (let i = 1; i < segPoints.length; i++) {
                    ctx.lineTo(segPoints[i].x, segPoints[i].y);
                }
            }
            ctx.strokeStyle = "#b0ffb0";
            ctx.lineWidth = 1;
            ctx.shadowBlur = 2;
            ctx.stroke();
            
            // 端点光点（仅显示可显示的端点）
            for (let seg of segments) {
                let pts = seg.points;
                if (pts.length === 0) continue;
                ctx.fillStyle = "#8eff9e";
                ctx.shadowBlur = 4;
                ctx.beginPath();
                ctx.arc(pts[0].x, pts[0].y, 2.5, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(pts[pts.length-1].x, pts[pts.length-1].y, 2.5, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
            
            // 绘制刷新线（垂直亮线）
            ctx.save();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(scanX, 0);
            ctx.lineTo(scanX, HEIGHT);
            ctx.strokeStyle = "#ffffaa";
            ctx.lineWidth = 2;
            ctx.stroke();
            // 增加光晕
            ctx.beginPath();
            ctx.moveTo(scanX, 0);
            ctx.lineTo(scanX, HEIGHT);
            ctx.strokeStyle = "#ffff88";
            ctx.lineWidth = 1;
            ctx.stroke();
            // 添加半透明背景强调
            ctx.fillStyle = "#ffffaa20";
            ctx.fillRect(scanX - 1, 0, 3, HEIGHT);
            ctx.restore();
            
            // 心率文本
            ctx.font = "9px 'Courier New', monospace";
            ctx.fillStyle = "#7eff86";
            let hrText = `❤️ ECG MODE | HR:${Math.floor(60 + params.freq*800)}bpm ❤️`;
            ctx.fillText(hrText, WIDTH-210, HEIGHT-10);
        }
        
        // 绘制覆盖层（网格+符号）
        function drawOverlay() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawGrid();
            if (overlayType === 'checkmark') {
                drawCheckmarkOnly();
            } else if (overlayType === 'arrow') {
                drawRightArrowOnly();
            }
        }
        
        function drawCheckmarkOnly() {
            const centerX = WIDTH / 2;
            const centerY = HEIGHT / 2;
            const radius = 60;
            ctx.save();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = "#5eff6e";
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius-2, 0, Math.PI * 2);
            ctx.strokeStyle = "#aaffaa";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            const offset = 28;
            ctx.moveTo(centerX - offset, centerY);
            ctx.lineTo(centerX - 8, centerY + offset - 5);
            ctx.lineTo(centerX + offset - 5, centerY - offset + 8);
            ctx.strokeStyle = "#cfff9e";
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius-8, 0, Math.PI * 2);
            ctx.strokeStyle = "#2eff6e30";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }
        
        function drawRightArrowOnly() {
            const centerX = WIDTH / 2;
            const centerY = HEIGHT / 2;
            const arrowLength = 130;
            const stemWidth = 22;
            const headWidth = 52;
            const headDepth = 38;
            ctx.save();
            ctx.shadowBlur = 0;
            const startX = centerX - arrowLength/2 + 8;
            const stemEndX = centerX + arrowLength/2 - headDepth;
            ctx.fillStyle = "#5eff6e";
            ctx.fillRect(startX, centerY - stemWidth/2, stemEndX - startX, stemWidth);
            ctx.beginPath();
            ctx.moveTo(stemEndX, centerY - headWidth/2);
            ctx.lineTo(centerX + arrowLength/2, centerY);
            ctx.lineTo(stemEndX, centerY + headWidth/2);
            ctx.fill();
            ctx.fillStyle = "#aaffaa";
            ctx.fillRect(startX + 4, centerY - stemWidth/2 + 3, stemEndX - startX - 8, stemWidth - 6);
            ctx.beginPath();
            ctx.moveTo(stemEndX + 2, centerY - headWidth/2 + 5);
            ctx.lineTo(centerX + arrowLength/2 - 2, centerY);
            ctx.lineTo(stemEndX + 2, centerY + headWidth/2 - 5);
            ctx.fill();
            ctx.fillStyle = "#8effa0";
            ctx.fillRect(startX - 6, centerY - 12, 12, 24);
            ctx.restore();
        }
        
        function generateRandomECGParams() {
            const freq = 0.022 + Math.random() * 0.026;
            const rAmp = 45 + Math.random() * 55;
            const tAmp = 20 + Math.random() * 40;
            const pAmp = 5 + Math.random() * 14;
            const qsAmp = 18 + Math.random() * 32;
            const baselineDrift = (Math.random() * 6 + 2) * (Math.random() > 0.5 ? 1 : -1);
            let ampScale = rAmp * 0.9;
            if (ampScale > 95) ampScale = 95;
            if (ampScale < 40) ampScale = 45;
            return { freq, rAmp, tAmp, pAmp, qsAmp, baselineDrift, ampScale };
        }
        
        // 动画循环
        function startAnimationLoop() {
            if (animationId !== null) return;
            function animate(now) {
                if (lastTimestamp !== 0 && isWaveActive && ecgParams && !overlayActive) {
                    let delta = Math.min(32, now - lastTimestamp);
                    globalPhase += delta * PHASE_SPEED;
                    if (globalPhase > Math.PI * 2) globalPhase -= Math.PI * 2;
                }
                lastTimestamp = now;
                
                // 更新刷新线位置（仅在波形活跃且无覆盖层时移动）
                if (isWaveActive && ecgParams && !overlayActive) {
                    scanX += SCAN_SPEED;
                    if (scanX > WIDTH + ERASE_WIDTH) {
                        scanX = -ERASE_WIDTH; // 循环回到左侧外
                    }
                } else {
                    // 非波形模式，线移到左侧外
                    if (scanX > WIDTH) scanX = -ERASE_WIDTH;
                }
                
                if (overlayActive) {
                    if (now < overlayEndTime) {
                        drawOverlay();
                    } else {
                        overlayActive = false;
                        overlayType = null;
                    }
                }
                
                if (!overlayActive) {
                    if (isWaveActive && ecgParams) {
                        drawECGWaveformWithRefreshLine(ecgParams, globalPhase);
                    } else {
                        drawStraightLine();
                    }
                }
                
                animationId = requestAnimationFrame(animate);
            }
            animationId = requestAnimationFrame(animate);
        }
        
        function clearOverlay() {
            overlayActive = false;
            overlayType = null;
        }
        
        function showCheckmark() {
            clearOverlay();
            overlayActive = true;
            overlayType = 'checkmark';
            overlayEndTime = performance.now() + 1500;
            const statusSpan = document.querySelector('.status span');
            if (statusSpan) {
                statusSpan.innerHTML = `✓ CHECKMARK ✓`;
                setTimeout(() => {
                    if (statusSpan && !overlayActive) {
                        if (isWaveActive) statusSpan.innerHTML = `❤️ ECG + CONTINUOUS BEEP ❤️`;
                        else if (!isWaveActive && !beepEnabled) statusSpan.innerHTML = `⚡ GREEN SCREEN MODE ⚡`;
                    }
                }, 1200);
            }
        }
        
        function showArrow() {
            clearOverlay();
            overlayActive = true;
            overlayType = 'arrow';
            overlayEndTime = performance.now() + 1500;
            const statusSpan = document.querySelector('.status span');
            if (statusSpan) {
                statusSpan.innerHTML = `→ SQUARE ARROW →`;
                setTimeout(() => {
                    if (statusSpan && !overlayActive) {
                        if (isWaveActive) statusSpan.innerHTML = `❤️ ECG + CONTINUOUS BEEP ❤️`;
                        else if (!isWaveActive && !beepEnabled) statusSpan.innerHTML = `⚡ GREEN SCREEN MODE ⚡`;
                    }
                }, 1200);
            }
        }
        
        function onSpaceDown() {
            clearOverlay();
            ecgParams = generateRandomECGParams();
            isWaveActive = true;
            globalPhase = 0;
            lastTimestamp = performance.now();
            incrementTriggerCount();
            if (!animationId) startAnimationLoop();
            if (!beepEnabled) {
                beepEnabled = true;
                startIntermittentBeep();
            }
            const statusSpan = document.querySelector('.status span');
            if (statusSpan) statusSpan.innerHTML = `❤️ ECG + CONTINUOUS BEEP ❤️`;
        }
        
        function onSpaceUp() {
            // 保持状态
        }
        
        function onRKey() {
            clearOverlay();
            beepEnabled = false;
            stopIntermittentBeep();
            isWaveActive = false;
            ecgParams = null;
            globalPhase = 0;
            drawStraightLine();
            playContinuousBeep2Seconds();
            const statusSpan = document.querySelector('.status span');
            if (statusSpan) statusSpan.innerHTML = `⚠️ 2s BEEP → LINE ⚠️`;
            setTimeout(() => {
                if (statusSpan && !isWaveActive && !beepEnabled && !overlayActive) {
                    statusSpan.innerHTML = `⚡ GREEN SCREEN MODE ⚡`;
                }
            }, 2100);
        }
        
        function onDigitOne() {
            showCheckmark();
        }
        
        function onDigitTwo() {
            showArrow();
        }
        
        function handleKeyDown(e) {
            const key = e.code;
            if (key === 'Space') {
                e.preventDefault();
                e.stopPropagation();
                onSpaceDown();
                return false;
            }
            else if (key === 'KeyR') {
                e.preventDefault();
                e.stopPropagation();
                onRKey();
                return false;
            }
            else if (key === 'Digit1') {
                e.preventDefault();
                e.stopPropagation();
                onDigitOne();
                return false;
            }
            else if (key === 'Digit2') {
                e.preventDefault();
                e.stopPropagation();
                onDigitTwo();
                return false;
            }
            return true;
        }
        
        function handleKeyUp(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                e.stopPropagation();
                onSpaceUp();
                return false;
            }
            return true;
        }
        
        function handleBlur() {}
        
        function bindEvents() {
            window.addEventListener('keydown', handleKeyDown, true);
            document.addEventListener('keydown', handleKeyDown, true);
            window.addEventListener('keyup', handleKeyUp, true);
            document.addEventListener('keyup', handleKeyUp, true);
            window.addEventListener('blur', handleBlur);
        }
        
        function warmupAudio() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(e=>console.log);
            }
            window.removeEventListener('click', warmupAudio);
            window.removeEventListener('keydown', warmupAudio);
        }
        
        function init() {
            drawStraightLine();
            isWaveActive = false;
            beepEnabled = false;
            ecgParams = null;
            triggerCount = 0;
            overlayActive = false;
            overlayType = null;
            scanX = -ERASE_WIDTH;
            if (actionCountSpan) actionCountSpan.innerText = `触发:0`;
            bindEvents();
            canvas.addEventListener('click', () => {
                canvas.style.boxShadow = '0 0 0 2px #6eff6e80';
                setTimeout(() => { canvas.style.boxShadow = ''; }, 200);
            });
            initAudio();
            window.addEventListener('click', warmupAudio);
            window.addEventListener('keydown', warmupAudio);
            startAnimationLoop();
            console.log("✅ 心电图仪 | 刷新线特效：线后方一段波形隐藏，再后方恢复显示");
        }
        
        window.addEventListener('load', init);
    })();
</script>
</body>
</html>
