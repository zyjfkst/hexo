<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>绿屏心电图仪 | 按住空格持续蜂鸣 + 动态心电图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1a, #030507);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Fira Code', monospace;
            padding: 20px;
        }

        .crt-container {
            background: #000000;
            border-radius: 28px;
            padding: 20px 20px 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(80, 255, 80, 0.1);
            border: 1px solid #1a3a1a;
        }

        .screen {
            background: #031003;
            border-radius: 16px;
            padding: 12px;
            box-shadow: inset 0 0 30px rgba(0, 20, 0, 0.8), 0 0 0 2px #2a6e2a;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #010c01;
            border-radius: 12px;
            box-shadow: 0 0 0 1px #2aff6e20, 0 0 0 2px #0f3f0f;
            cursor: crosshair;
        }

        .scanlines {
            pointer-events: none;
            position: relative;
            overflow: hidden;
        }
        .scanlines::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.02) 0px,
                rgba(0, 255, 0, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
            border-radius: 12px;
        }

        .info-panel {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #071007cc;
            backdrop-filter: blur(2px);
            padding: 10px 18px;
            border-radius: 40px;
            border-left: 3px solid #2eff6e;
            font-weight: bold;
        }

        .status {
            color: #b3ffbc;
            text-shadow: 0 0 3px #00cc33;
            font-size: 0.85rem;
            letter-spacing: 1px;
            background: #0c1a0c;
            padding: 4px 12px;
            border-radius: 24px;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .key-hint {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .key {
            background: #1e2a1a;
            color: #adffa7;
            padding: 5px 12px;
            border-radius: 30px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            border: 1px solid #4aff6e;
            box-shadow: 0 0 4px #14ff5e;
        }

        .key kbd {
            background: #000000aa;
            padding: 2px 8px;
            border-radius: 30px;
            color: #caffa2;
            margin-right: 6px;
            font-weight: bold;
            border: 1px solid #88ff88;
            font-size: 0.8rem;
        }

        .feedback {
            font-size: 0.7rem;
            background: #0f1f0f;
            padding: 4px 12px;
            border-radius: 40px;
            color: #94ff94;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indicator {
            width: 10px;
            height: 10px;
            background-color: #2eff5e;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ff40;
            transition: 0.1s;
        }
        .indicator.blink {
            background-color: #ffff80;
            box-shadow: 0 0 12px #ffff00;
            transform: scale(1.2);
        }

        .footer {
            font-size: 0.7rem;
            text-align: center;
            color: #3f8440;
            margin-top: 16px;
            font-family: monospace;
        }

        @keyframes subtlePulse {
            0% { text-shadow: 0 0 1px #0f0; }
            100% { text-shadow: 0 0 6px #2eff6e; }
        }
        .status span {
            animation: subtlePulse 1.5s infinite alternate;
        }
    </style>
</head>
<body>
<div class="crt-container">
    <div class="screen scanlines">
        <canvas id="waveCanvas" width="900" height="400" style="width:100%; height:auto; max-width:1000px; aspect-ratio:900/400"></canvas>
    </div>
    <div class="info-panel">
        <div class="status">
            ⚡ <span>GREEN SCREEN MODE</span> ⚡
            <div class="feedback">
                <div class="indicator" id="keyIndicator"></div>
                <span id="actionCount">触发:0</span>
            </div>
        </div>
        <div class="key-hint">
            <div class="key"><kbd>␣</kbd> 按住 → 持续蜂鸣 + 动态心电图</div>
            <div class="key"><kbd>R</kbd> 重置直线</div>
        </div>
    </div>
    <div class="footer">
        ✦ 按住空格：持续880Hz蜂鸣声 + 动态心电图 ✦ 松开即停止蜂鸣并恢复直线 ✦
    </div>
</div>

<script>
    (function(){
        // ----- DOM 元素 -----
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const indicator = document.getElementById('keyIndicator');
        const actionCountSpan = document.getElementById('actionCount');
        
        // 固定尺寸
        const WIDTH = 900;
        const HEIGHT = 400;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        const CENTER_Y = HEIGHT / 2;
        
        // 心电图参数
        let ecgParams = null;
        let isLineMode = true;
        let spacePressed = false;
        let generatedOnPress = false;
        let triggerCount = 0;
        
        // 动态刷新相关
        let animationId = null;
        let lastTimestamp = 0;
        let globalPhase = 0;
        const PHASE_SPEED = 0.022;
        
        // ========== 持续蜂鸣音效模块 ==========
        let audioCtx = null;
        let activeOscillator = null;      // 当前激活的振荡器
        let activeGain = null;             // 音量控制
        let isBeeping = false;
        
        // 初始化音频上下文 (懒加载，首次用户交互时创建)
        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                console.log("AudioContext created");
            } catch(e) {
                console.warn("Web Audio API not supported", e);
            }
        }
        
        // 开始持续蜂鸣 (880Hz 正弦波)
        function startContinuousBeep() {
            if (!audioCtx) {
                initAudio();
                if (!audioCtx) return;
            }
            // 如果已经处于蜂鸣状态，不重复创建
            if (isBeeping) return;
            
            // 确保音频上下文处于运行状态（用户手势恢复）
            const startOsc = () => {
                if (audioCtx.state === 'closed') return;
                try {
                    // 创建振荡器和增益节点
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.type = 'sine';
                    osc.frequency.value = 880;   // 典型蜂鸣频率
                    gain.gain.value = 0.25;       // 音量适中
                    
                    osc.start();
                    // 保存以便后续停止
                    activeOscillator = osc;
                    activeGain = gain;
                    isBeeping = true;
                    
                    // 可选: 振荡器结束时自动清理
                    osc.onended = () => {
                        if (activeOscillator === osc) {
                            activeOscillator = null;
                            activeGain = null;
                            isBeeping = false;
                        }
                    };
                } catch(e) {
                    console.warn("Start continuous beep failed", e);
                }
            };
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    console.log("AudioContext resumed for beep");
                    startOsc();
                }).catch(err => console.warn("Resume failed", err));
            } else {
                startOsc();
            }
        }
        
        // 停止持续蜂鸣 (平滑静音)
        function stopContinuousBeep() {
            if (!isBeeping) return;
            if (activeGain) {
                // 快速淡出避免爆音
                const now = audioCtx ? audioCtx.currentTime : 0;
                try {
                    activeGain.gain.setValueAtTime(activeGain.gain.value, now);
                    activeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
                } catch(e) {}
            }
            if (activeOscillator) {
                try {
                    activeOscillator.stop();
                } catch(e) {}
                activeOscillator = null;
            }
            activeGain = null;
            isBeeping = false;
        }
        
        // ----- UI 辅助 -----
        function blinkIndicator() {
            if (!indicator) return;
            indicator.classList.add('blink');
            setTimeout(() => indicator.classList.remove('blink'), 120);
        }
        
        function incrementTriggerCount() {
            triggerCount++;
            if (actionCountSpan) actionCountSpan.innerText = `触发:${triggerCount}`;
            blinkIndicator();
        }
        
        // ========== 绘制基础 ==========
        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = "#1d5520";
            ctx.lineWidth = 0.6;
            ctx.shadowBlur = 0;
            for (let x = 0; x <= WIDTH; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y <= HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(WIDTH, y);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(WIDTH, CENTER_Y);
            ctx.strokeStyle = "#4eff6e80";
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }
        
        function drawStraightLine() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawGrid();
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(WIDTH, CENTER_Y);
            ctx.strokeStyle = "#3eff5e";
            ctx.lineWidth = 2.8;
            ctx.shadowColor = "#1aff4d";
            ctx.shadowBlur = 6;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, CENTER_Y);
            ctx.lineTo(WIDTH, CENTER_Y);
            ctx.strokeStyle = "#ccffaa";
            ctx.lineWidth = 1.2;
            ctx.shadowBlur = 3;
            ctx.stroke();
            ctx.fillStyle = "#5aff6e";
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(0, CENTER_Y, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(WIDTH, CENTER_Y, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.font = "10px 'Courier New', monospace";
            ctx.fillStyle = "#49b849";
            ctx.fillText("✦ BASELINE LOCK ✦", WIDTH-110, HEIGHT-8);
        }
        
        // 心电图核心算法
        function getNormalizedECG(angle, params) {
            let t = angle % (Math.PI * 2);
            let value = 0;
            let rAmp = params.rAmp;
            let tAmp = params.tAmp;
            let pAmp = params.pAmp;
            let qsAmp = params.qsAmp;
            
            if (t < 0.12) {
                let phaseP = (t / 0.12) * Math.PI;
                value = pAmp * Math.sin(phaseP);
            } 
            else if (t < 0.18) value = 0;
            else if (t < 0.32) {
                let qrsT = (t - 0.18) / 0.14;
                if (qrsT < 0.25) {
                    let qFactor = 1 - (qrsT / 0.25);
                    value = -qsAmp * 0.6 * qFactor;
                } else if (qrsT < 0.55) {
                    let rFactor = Math.sin(((qrsT - 0.25) / 0.3) * Math.PI);
                    value = rAmp * rFactor;
                } else {
                    let sFactor = 1 - ((qrsT - 0.55) / 0.45);
                    value = -qsAmp * sFactor;
                }
            }
            else if (t < 0.5) {
                let stT = (t - 0.32) / 0.18;
                let tRise = Math.sin(stT * Math.PI * 0.8);
                value = tAmp * tRise * 0.7;
            }
            else if (t < 0.75) {
                let tPhase = (t - 0.5) / 0.25;
                let tShape = Math.sin(tPhase * Math.PI);
                value = tAmp * tShape;
            }
            else {
                let restPhase = (t - 0.75) / 0.25;
                value = tAmp * (1 - restPhase) * 0.2;
                if (value < 0) value = 0;
            }
            
            let drift = params.baselineDrift * Math.sin(angle * 0.5);
            value += drift;
            return Math.min(0.95, Math.max(-0.65, value));
        }
        
        function getECGOffsetY(x, params, phaseShift) {
            let heartFreq = params.freq;
            let angle = (x * heartFreq) + phaseShift;
            let normValue = getNormalizedECG(angle, params);
            let maxOffset = params.ampScale;
            return normValue * maxOffset;
        }
        
        function drawECGWaveform(params, phaseShift) {
            if (!params) {
                drawStraightLine();
                return;
            }
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawGrid();
            ctx.save();
            ctx.beginPath();
            let firstY = CENTER_Y + getECGOffsetY(0, params, phaseShift);
            ctx.moveTo(0, firstY);
            for (let x = 1; x <= WIDTH; x++) {
                let offset = getECGOffsetY(x, params, phaseShift);
                let y = CENTER_Y + offset;
                let clampedY = Math.min(HEIGHT - 5, Math.max(5, y));
                ctx.lineTo(x, clampedY);
            }
            ctx.strokeStyle = "#3eff6e";
            ctx.lineWidth = 2.4;
            ctx.shadowColor = "#1eff5a";
            ctx.shadowBlur = 5;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, firstY);
            for (let x = 1; x <= WIDTH; x++) {
                let offset = getECGOffsetY(x, params, phaseShift);
                let y = CENTER_Y + offset;
                let clampedY = Math.min(HEIGHT - 5, Math.max(5, y));
                ctx.lineTo(x, clampedY);
            }
            ctx.strokeStyle = "#b0ffb0";
            ctx.lineWidth = 0.9;
            ctx.shadowBlur = 2;
            ctx.stroke();
            let endY = CENTER_Y + getECGOffsetY(WIDTH, params, phaseShift);
            ctx.fillStyle = "#8eff9e";
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(0, Math.min(HEIGHT-5, Math.max(5, firstY)), 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(WIDTH, Math.min(HEIGHT-5, Math.max(5, endY)), 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            ctx.font = "9px 'Courier New', monospace";
            ctx.fillStyle = "#7eff86";
            let hrText = `❤️ ECG MODE | HR:${Math.floor(60 + params.freq*800)}bpm ❤️`;
            ctx.fillText(hrText, WIDTH-210, HEIGHT-10);
        }
        
        function generateRandomECGParams() {
            const freq = 0.022 + Math.random() * 0.026;
            const rAmp = 45 + Math.random() * 55;
            const tAmp = 20 + Math.random() * 40;
            const pAmp = 5 + Math.random() * 14;
            const qsAmp = 18 + Math.random() * 32;
            const baselineDrift = (Math.random() * 6 + 2) * (Math.random() > 0.5 ? 1 : -1);
            let ampScale = rAmp * 0.9;
            if (ampScale > 95) ampScale = 95;
            if (ampScale < 40) ampScale = 45;
            return { freq, rAmp, tAmp, pAmp, qsAmp, baselineDrift, ampScale };
        }
        
        function stopAnimation() {
            if (animationId !== null) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
        
        function startECGAnimation() {
            if (animationId !== null) stopAnimation();
            lastTimestamp = performance.now();
            function animate(now) {
                if (!isLineMode && ecgParams && spacePressed) {
                    if (lastTimestamp !== 0) {
                        let delta = Math.min(32, now - lastTimestamp);
                        globalPhase += delta * PHASE_SPEED;
                        if (globalPhase > Math.PI * 2) globalPhase -= Math.PI * 2;
                    }
                    lastTimestamp = now;
                    drawECGWaveform(ecgParams, globalPhase);
                    animationId = requestAnimationFrame(animate);
                } else {
                    stopAnimation();
                }
            }
            animationId = requestAnimationFrame(animate);
        }
        
        // 按下空格: 生成心电图参数，启动心电图动画，开始持续蜂鸣
        function startECGAndFlow() {
            if (spacePressed) return;
            spacePressed = true;
            generatedOnPress = false;
            if (!generatedOnPress) {
                ecgParams = generateRandomECGParams();
                generatedOnPress = true;
                incrementTriggerCount();
                globalPhase = 0;
            }
            isLineMode = false;
            lastTimestamp = performance.now();
            drawECGWaveform(ecgParams, globalPhase);
            stopAnimation();
            startECGAnimation();
            // 启动持续蜂鸣
            startContinuousBeep();
            const statusSpan = document.querySelector('.status span');
            if (statusSpan) statusSpan.innerHTML = `❤️ ECG + BEEP ❤️`;
        }
        
        // 松开空格: 停止蜂鸣，恢复直线模式
        function resetToLine() {
            if (!spacePressed && isLineMode) return;
            spacePressed = false;
            generatedOnPress = false;
            stopAnimation();
            // 停止蜂鸣
            stopContinuousBeep();
            isLineMode = true;
            ecgParams = null;
            globalPhase = 0;
            drawStraightLine();
            const statusSpan = document.querySelector('.status span');
            if (statusSpan) statusSpan.innerHTML = `⚡ GREEN SCREEN MODE ⚡`;
        }
        
        // 强制重置（R键）
        function forceReset() {
            stopAnimation();
            stopContinuousBeep();
            spacePressed = false;
            generatedOnPress = false;
            isLineMode = true;
            ecgParams = null;
            globalPhase = 0;
            drawStraightLine();
            const statusSpan = document.querySelector('.status span');
            if (statusSpan) statusSpan.innerHTML = `⚡ GREEN SCREEN MODE ⚡`;
        }
        
        function handleKeyDown(e) {
            const key = e.code;
            if (key === 'Space') {
                e.preventDefault();
                e.stopPropagation();
                if (!spacePressed) {
                    startECGAndFlow();
                }
                return false;
            }
            else if (key === 'KeyR') {
                e.preventDefault();
                e.stopPropagation();
                forceReset();
                return false;
            }
            return true;
        }
        
        function handleKeyUp(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                e.stopPropagation();
                if (spacePressed) resetToLine();
                return false;
            }
            return true;
        }
        
        function handleBlur() {
            if (spacePressed) resetToLine();
        }
        
        function bindEvents() {
            window.addEventListener('keydown', handleKeyDown, true);
            document.addEventListener('keydown', handleKeyDown, true);
            window.addEventListener('keyup', handleKeyUp, true);
            document.addEventListener('keyup', handleKeyUp, true);
            window.addEventListener('blur', handleBlur);
        }
        
        // 预热音频: 在页面任意点击时提前创建并挂起上下文，避免空格按下时延迟
        function warmupAudio() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    console.log("AudioContext warmed up and suspended again?");
                    // 立即挂起？不，保持活跃即可，但为了节能，可以挂起，但我们不操作
                }).catch(e=>console.log);
            }
            // 移除自身，只需一次
            window.removeEventListener('click', warmupAudio);
            window.removeEventListener('keydown', warmupAudio);
        }
        
        function init() {
            drawStraightLine();
            isLineMode = true;
            spacePressed = false;
            generatedOnPress = false;
            ecgParams = null;
            globalPhase = 0;
            triggerCount = 0;
            if (actionCountSpan) actionCountSpan.innerText = `触发:0`;
            bindEvents();
            canvas.addEventListener('click', () => {
                canvas.style.boxShadow = '0 0 0 2px #6eff6e80';
                setTimeout(() => { canvas.style.boxShadow = ''; }, 200);
            });
            // 预先初始化音频但不激活 (避免自动播放策略)
            initAudio();
            // 用户首次点击或任意键时唤醒音频上下文 (减少延迟)
            window.addEventListener('click', warmupAudio);
            window.addEventListener('keydown', warmupAudio);
            console.log("✅ 心电图仪 + 持续蜂鸣 | 按住空格：880Hz持续音 + 动态心电图 | 松开停止");
        }
        
        window.addEventListener('load', init);
    })();
</script>
</body>
</html>
